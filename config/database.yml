# PostgreSQL connection settings.
# Copy .env.example to .env and set DB_PASSWORD (and DB_HOST for Docker/remote DB).
#
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DB_PORT") { 5432 } %>
  username: <%= ENV.fetch("DB_USER") { "postgres" } %>
  password: <%= ENV["DB_PASSWORD"] %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME") { "chat-cursor" } %>

test:
  <<: *default
  database: <%= ENV.fetch("DB_TEST_NAME") { "chat-cursor_test" } %>

production:
  primary: &primary_production
    <<: *default
    database: <%= ENV.fetch("DB_NAME") { "chat-cursor" } %>
  cache:
    <<: *primary_production
    database: <%= ENV.fetch("DB_CACHE_NAME") { "chat-cursor_cache" } %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: <%= ENV.fetch("DB_QUEUE_NAME") { "chat-cursor_queue" } %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: <%= ENV.fetch("DB_CABLE_NAME") { "chat-cursor_cable" } %>
    migrations_paths: db/cable_migrate
